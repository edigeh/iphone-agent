<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="iPhone Agent: let an AI agent use a real iPhone from your Mac">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#121a3a"/>
      <stop offset="1" stop-color="#1d1145"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9a8ff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f6b"/>
      <stop offset="1" stop-color="#151935"/>
    </linearGradient>
    <linearGradient id="wire" gradientUnits="userSpaceOnUse" x1="896" y1="0" x2="1000" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="150" font-size="68" font-weight="800" fill="url(#title)" letter-spacing="-1.5">iPhone Agent</text>
    <text x="74" y="204" font-size="27" fill="#c7cbe6">Let an AI agent use a real iPhone</text>
    <text x="74" y="240" font-size="27" fill="#c7cbe6">from your Mac.</text>
    <g font-size="17" font-weight="600">
      <rect x="74" y="282" width="78" height="36" rx="18" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="113" y="306" text-anchor="middle" fill="#7dd3fc">MCP</text>
      <rect x="164" y="282" width="78" height="36" rx="18" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="203" y="306" text-anchor="middle" fill="#c4b5fd">USB</text>
      <rect x="254" y="282" width="92" height="36" rx="18" fill="#34d399" fill-opacity="0.13" stroke="#34d399" stroke-opacity="0.5"/>
      <text x="300" y="306" text-anchor="middle" fill="#6ee7b7">Wi-Fi</text>
      <rect x="358" y="282" width="132" height="36" rx="18" fill="#f472b6" fill-opacity="0.13" stroke="#f472b6" stroke-opacity="0.5"/>
      <text x="424" y="306" text-anchor="middle" fill="#f9a8d4">Local only</text>
    </g>

    <!-- agent terminal -->
    <g transform="translate(640 120)">
      <rect width="250" height="170" rx="14" fill="#0d1226" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="20" cy="20" r="5" fill="#ff5f57"/><circle cx="38" cy="20" r="5" fill="#febc2e"/><circle cx="56" cy="20" r="5" fill="#28c840"/>
      <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14">
        <text x="20" y="60" fill="#7dd3fc">agent</text><text x="72" y="60" fill="#c7cbe6">› open Settings</text>
        <text x="20" y="88" fill="#a78bfa">iphone_open</text>
        <text x="20" y="114" fill="#a78bfa">iphone_tap</text><text x="112" y="114" fill="#6b7280">x:196 y:412</text>
        <text x="20" y="140" fill="#34d399">✓ done</text>
      </g>
    </g>
    <path d="M 896 205 C 940 205, 950 205, 990 205" stroke="url(#wire)" stroke-width="3" fill="none" stroke-dasharray="7 7" stroke-linecap="round"/>
    <circle cx="896" cy="205" r="5" fill="#38bdf8"/>

    <!-- phone -->
    <g transform="translate(1000 46)">
      <rect width="186" height="330" rx="34" fill="#0a0d1c" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
      <rect x="10" y="10" width="166" height="310" rx="26" fill="url(#screen)"/>
      <rect x="66" y="20" width="54" height="16" rx="8" fill="#0a0d1c"/>
      <g fill="#ffffff" fill-opacity="0.9">
        <rect x="28" y="60" width="34" height="34" rx="9" fill="#38bdf8"/>
        <rect x="76" y="60" width="34" height="34" rx="9" fill="#a78bfa"/>
        <rect x="124" y="60" width="34" height="34" rx="9" fill="#34d399"/>
        <rect x="28" y="110" width="34" height="34" rx="9" fill="#f472b6"/>
        <rect x="76" y="110" width="34" height="34" rx="9" fill="#fbbf24"/>
        <rect x="124" y="110" width="34" height="34" rx="9" fill="#94a3b8"/>
        <rect x="28" y="160" width="34" height="34" rx="9" fill="#fb7185"/>
        <rect x="76" y="160" width="34" height="34" rx="9" fill="#60a5fa"/>
      </g>
      <circle cx="141" cy="177" r="26" fill="#ffffff" fill-opacity="0.10"/>
      <circle cx="141" cy="177" r="16" fill="#ffffff" fill-opacity="0.22"/>
      <circle cx="141" cy="177" r="7" fill="#ffffff"/>
      <rect x="124" y="160" width="34" height="34" rx="9" fill="none" stroke="#ffffff" stroke-width="2"/>
      <rect x="24" y="270" width="138" height="34" rx="12" fill="#ffffff" fill-opacity="0.12"/>
      <rect x="68" y="308" width="50" height="4" rx="2" fill="#ffffff" fill-opacity="0.6"/>
    </g>
  </g>
</svg>
